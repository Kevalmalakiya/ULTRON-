name: ULTRON Android Build

on:
  push:
    branches:
      - main
      - ultron-integration
  pull_request:
    branches:
      - main
      - ultron-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run unit tests and build APK
        run: |
          gradle --no-daemon --stacktrace \
            clean \
            testDebugUnitTest \
            assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ULTRON-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
